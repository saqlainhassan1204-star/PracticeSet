<input type="password" id="pass">

<button onclick="togglepass()">Button</button>

<script>

    function tooglepass(){

    let input=document.getElementById("pass");
    if(input.type==="password"){
        input.type=="text";
        }
    
    else{

        input.type="password";
    }}
</script>
